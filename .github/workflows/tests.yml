name: 'Node.js CI'

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '49 4 * * 1'

permissions:
  checks: write
  pull-requests: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Enable Corepack
      run: corepack enable
    - name: Use Node.js 24.x
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
        cache: 'yarn'
    - name: Install dependencies
      run: yarn install --immutable
    - name: Run lint
      run: yarn lint:ci
    - name: Run build
      run: yarn build
    - name: Run tests & coverage
      uses: ArtiomTr/jest-coverage-report-action@v2
      with:
        icons: emoji
        package-manager: yarn
        test-script: yarn test:ci
        skip-step: install
